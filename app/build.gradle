plugins {
    id 'com.android.application'
}

base.archivesName.set('VoluntTold')

android {
    namespace 'com.mca.fieldreports'
    compileSdk 34

    defaultConfig {
        applicationId "com.mca.fieldreports"
        minSdk 26
        targetSdk 34
        versionCode 2
        versionName "2.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // The website in ../web is packaged inside the app, so it runs offline and full screen.
    sourceSets {
        main {
            assets.srcDir '../web'
        }
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'
    implementation 'androidx.core:core:1.13.1'
}
