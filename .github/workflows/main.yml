name: Build VoluntTold APK

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:        # lets you press "Run workflow" in the Actions tab

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Find the Android project folder
        id: proj
        run: |
          f=$(find . -name settings.gradle -not -path './.git/*' | awk '{print length, $0}' | sort -n | head -1 | cut -d' ' -f2-)
          if [ -z "$f" ]; then
            echo "::error::No settings.gradle found. Upload the project files (settings.gradle, build.gradle, app folder) to the repository."
            echo "Files in the repository:"; find . -not -path './.git/*' -type f | head -50
            exit 1
          fi
          dir=$(dirname "$f")
          echo "Project folder: $dir"
          echo "dir=$dir" >> "$GITHUB_OUTPUT"

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Build debug APK
        working-directory: ${{ steps.proj.outputs.dir }}
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VoluntTold-APK
          path: ${{ steps.proj.outputs.dir }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
